[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-automation-platform"
version = "0.1.0"
description = "Personal automation platform: scrapes sources (Studeo, Akita), keeps local state, and drives Telegram / Email / Google Calendar / Google Drive"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2,<3.3",
    "requests>=2.32,<3",
    "python-dotenv>=1.0,<2",
    "tenacity>=9.0,<10",
    "sentry-sdk>=2.0,<3",
    "google-api-python-client>=2.140,<3",
    "google-auth>=2.30,<3",
    "google-auth-oauthlib>=1.2,<2",
    "anthropic>=0.121,<1",
    "openai>=2.0,<3",
    "google-genai>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
pap = "pap.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

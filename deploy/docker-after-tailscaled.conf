# Install to /etc/systemd/system/docker.service.d/after-tailscaled.conf
# then: systemctl daemon-reload && systemctl restart docker
#
# docker-compose.yml publishes Postgres on the Tailscale address
# (<TAILSCALE_IP>:5432). Docker binds published ports at container start, and
# binding to an address that does not exist yet fails hard with:
#
#     Error starting userland proxy: listen tcp4 <TAILSCALE_IP>:5432:
#     bind: cannot assign requested address
#
# Without this ordering, whether the stack survives a reboot depends on whether
# tailscaled happened to finish first — which it usually does, right up until the
# once-in-a-while boot where it doesn't.
[Unit]
After=tailscaled.service
Wants=tailscaled.service
